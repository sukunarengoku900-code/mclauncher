name: Build mcLauncher for Windows

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
    paths:
      - "**.py"
      - "requirements.txt"
      - ".github/workflows/build-windows.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Gerar mcLauncher.exe
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name mcLauncher mc_launcher.py

      - name: Publicar executável
        uses: actions/upload-artifact@v4
        with:
          name: mcLauncher-Windows
          path: dist/mcLauncher.exe
          if-no-files-found: error
